name: Hardware report
description: Tell us how Predator Sense works on your model
labels: [hardware]
body:
  - type: input
    id: model
    attributes:
      label: Laptop model
      description: "`cat /sys/class/dmi/id/product_name` (e.g. Predator PHN16-72)"
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version
      description: "`cat /sys/class/dmi/id/bios_version`"
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Operating modes
        - label: Fan control (auto / max / custom)
        - label: Temperatures and fan RPM
        - label: Keyboard lighting
        - label: Battery 80% limit
        - label: Power-off USB charging
        - label: Boot sound
        - label: Mode hotkey
  - type: textarea
    id: info
    attributes:
      label: predatorctl info
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
